name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/cache@v6
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'api/elm.json') }}
      - run: bun install --frozen-lockfile
      - run: bun fmt-check
      - run: bun run test
      - run: bun run build
